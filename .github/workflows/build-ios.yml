name: 🍼 Build BabyTracker IPA (iPhone)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build IPA para iPhone
    runs-on: macos-latest

    steps:
      - name: ⬇️ Baixar código
        uses: actions/checkout@v4

      - name: 🔧 Usar Xcode 26.5 (compatível com .NET 9 iOS)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: ⚙️ Instalar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 📦 Instalar workloads MAUI + iOS
        run: |
          dotnet workload install maui
          dotnet workload install ios

      - name: 🔄 Restaurar pacotes
        run: dotnet restore BabyTrackerMobile.csproj

      - name: 🏗️ Compilar IPA para iPhone
        run: |
          dotnet build BabyTrackerMobile.csproj \
            -f net9.0-ios \
            -c Release \
            /p:RuntimeIdentifier=ios-arm64 \
            /p:BuildIpa=true \
            /p:CodesignKey="" \
            /p:CodesignProvision="" \
            /p:_RequireCodeSigning=false \
            /p:SkipValidateMauiImplicitPackageReferences=true

      - name: 🔍 Localizar IPA gerado
        run: |
          find . -name "*.ipa" 2>/dev/null || echo "Nenhum .ipa encontrado"
          find bin -name "*.app" 2>/dev/null | head -5 || true

      - name: 📤 Upload IPA para download
        uses: actions/upload-artifact@v4
        with:
          name: BabyTracker-iPhone
          path: |
            **/*.ipa
            bin/Release/net9.0-ios/ios-arm64/publish/
          if-no-files-found: warn
          retention-days: 30
