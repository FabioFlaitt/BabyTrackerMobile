name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # permite rodar manualmente pelo GitHub

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: ⬇️ Checkout código
        uses: actions/checkout@v4

      - name: ⚙️ Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 📦 Instalar workload MAUI
        run: dotnet workload install maui-ios

      - name: 🔨 Restaurar dependências
        run: dotnet restore BabyTrackerMobile.csproj

      - name: 🏗️ Build iOS (simulador - sem assinatura)
        run: |
          dotnet build BabyTrackerMobile.csproj \
            -f net8.0-ios \
            -c Release \
            /p:RuntimeIdentifier=iossimulator-x64 \
            /p:CodesignKey="" \
            /p:CodesignProvision=""

      - name: 📤 Upload artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: BabyTracker-iOS-Build
          path: bin/Release/net8.0-ios/iossimulator-x64/
          retention-days: 30

# ──────────────────────────────────────────────────────────────────
# Para gerar um .IPA real para instalar no iPhone físico você
# precisará adicionar os segredos de assinatura Apple:
#
#   APPLE_CERTIFICATE_BASE64   - certificado P12 em base64
#   APPLE_CERTIFICATE_PASSWORD - senha do certificado
#   APPLE_PROVISIONING_PROFILE - perfil de provisionamento em base64
#
# Consulte: https://docs.microsoft.com/en-us/dotnet/maui/ios/deployment/
# ──────────────────────────────────────────────────────────────────
