name: 🍼 Build BabyTracker IPA (iPhone)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build IPA para iPhone
    runs-on: macos-latest

    steps:
      - name: ⬇️ Baixar código
        uses: actions/checkout@v4

      - name: ⚙️ Instalar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 📦 Instalar todos os workloads MAUI
        run: |
          dotnet workload install maui
          dotnet workload install ios

      - name: 🔄 Restaurar pacotes (somente iOS)
        run: dotnet restore BabyTrackerMobile.csproj -p:TargetFrameworks=net9.0-ios

      - name: 🏗️ Compilar IPA para iPhone
        run: |
          dotnet build BabyTrackerMobile.csproj \
            -f net9.0-ios \
            -c Release \
            /p:RuntimeIdentifier=ios-arm64 \
            /p:BuildIpa=true \
            /p:CodesignKey="" \
            /p:CodesignProvision="" \
            /p:_RequireCodeSigning=false

      - name: 🔍 Localizar arquivos gerados
        run: |
          echo "=== IPAs encontrados ==="
          find . -name "*.ipa" 2>/dev/null || echo "Nenhum .ipa encontrado"
          echo "=== App bundles ==="
          find . -name "*.app" -maxdepth 10 2>/dev/null | head -5

      - name: 📤 Upload IPA para download
        uses: actions/upload-artifact@v4
        with:
          name: BabyTracker-iPhone
          path: |
            **/*.ipa
            bin/Release/net9.0-ios/ios-arm64/publish/
          if-no-files-found: warn
          retention-days: 30
