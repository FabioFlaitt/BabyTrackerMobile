name: 🍼 Build BabyTracker IPA (iPhone)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build IPA para iPhone
    runs-on: macos-latest

    steps:
      - name: ⬇️ Baixar código
        uses: actions/checkout@v4

      - name: ⚙️ Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 📦 Instalar MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: 🔄 Restaurar pacotes NuGet
        run: dotnet restore BabyTrackerMobile.csproj

      - name: 🏗️ Compilar para iOS (device arm64)
        run: |
          dotnet build BabyTrackerMobile.csproj \
            -f net8.0-ios \
            -c Release \
            -r ios-arm64 \
            /p:BuildIpa=true \
            /p:CodesignKey="" \
            /p:CodesignProvision="" \
            /p:_RequireCodeSigning=false

      - name: 🔍 Localizar IPA gerado
        run: find . -name "*.ipa" 2>/dev/null && find . -name "*.app" -maxdepth 8 2>/dev/null || echo "Verificando bin/..."

      - name: 📤 Upload IPA / App bundle
        uses: actions/upload-artifact@v4
        with:
          name: BabyTracker-iPhone
          path: |
            **/*.ipa
            bin/Release/net8.0-ios/ios-arm64/publish/*.app
          if-no-files-found: warn
          retention-days: 30
