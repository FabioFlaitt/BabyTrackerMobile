name: 🍼 Build BabyTracker iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest

    steps:
      - name: ⬇️ Baixar código
        uses: actions/checkout@v4

      - name: 🔧 Usar Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: ⚙️ Instalar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 📦 Instalar workloads
        run: |
          dotnet workload install maui
          dotnet workload install ios

      - name: 🔄 Restaurar pacotes
        run: dotnet restore BabyTrackerMobile.csproj

      - name: 🏗️ Compilar para iOS Simulator (sem assinatura)
        run: |
          dotnet build BabyTrackerMobile.csproj \
            -f net9.0-ios \
            -c Release \
            /p:RuntimeIdentifier=iossimulator-arm64 \
            /p:SkipValidateMauiImplicitPackageReferences=true

      - name: 🔍 Listar arquivos gerados
        run: |
          echo "=== App bundles ==="
          find bin -name "*.app" 2>/dev/null | head -10
          echo "=== Todos os arquivos de saida ==="
          find bin/Release -type f 2>/dev/null | head -20

      - name: 📤 Upload build
        uses: actions/upload-artifact@v4
        with:
          name: BabyTracker-iOS-Build
          path: bin/Release/net9.0-ios/
          if-no-files-found: warn
          retention-days: 30
